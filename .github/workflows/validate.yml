name: Validate
on:
  workflow_call:
    inputs:
      release-version:
        type: string
        default: '0.0.0'
      changed-only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  scope:
    name: Select affected components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.select.outputs.firmware }}
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation scope
        id: select
        env:
          CHANGED_ONLY: ${{ inputs.changed-only }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$CHANGED_ONLY" = true ]; then
            test -n "$BASE_SHA" && test -n "$HEAD_SHA"
            python3 scripts/ci-scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/ci-scope.py
          fi
  tests:
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sh scripts/test.sh
        env:
          CXX: clang++
  firmware:
    needs: scope
    if: needs.scope.outputs.firmware != '[]'
    name: ESP32 ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.scope.outputs.firmware) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build firmware
        shell: bash
        env:
          APP: ${{ matrix.app }}
          # OTA images use ACRCloud credentials provisioned in device NVS.
          WAVEFORM_DEVICE_ACRCLOUD: "1"
          WAVEFORM_RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          . "$IDF_PATH/export.sh"
          cd "firmware/esp32/$APP"
          idf.py build
      - name: Package validated P4 application
        if: matrix.app == 'p4_display'
        env:
          WAVEFORM_RELEASE_VERSION: ${{ inputs.release-version }}
        run: python3 scripts/package-p4-update.py record --build firmware/esp32/p4_display/build --dist p4-dist --version "$WAVEFORM_RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.app == 'p4_display'
        with:
          name: esp32-p4-ota
          path: p4-dist/*
          if-no-files-found: error
          retention-days: 14
