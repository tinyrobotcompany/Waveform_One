name: Validate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sh scripts/test.sh
        env:
          CXX: clang++
  firmware:
    name: ESP32 ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        app: [led_test, mic_test, visualizer, kovi_scroll, quinie_scroll]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build firmware
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          . "$IDF_PATH/export.sh"
          cd "firmware/esp32/$APP"
          idf.py build
      - name: Package production firmware
        if: matrix.app == 'visualizer'
        run: python3 scripts/package-firmware.py firmware/esp32/visualizer/build dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.app == 'visualizer'
        with:
          name: esp32-visualizer
          path: dist/*
          if-no-files-found: error
          retention-days: 14
