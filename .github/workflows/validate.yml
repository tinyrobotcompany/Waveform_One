name: Validate
on:
  workflow_call:
    inputs:
      changed-only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  scope:
    name: Select affected components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.select.outputs.firmware }}
      pi: ${{ steps.select.outputs.pi }}
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation scope
        id: select
        env:
          CHANGED_ONLY: ${{ inputs.changed-only }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$CHANGED_ONLY" = true ]; then
            test -n "$BASE_SHA" && test -n "$HEAD_SHA"
            python3 scripts/ci-scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/ci-scope.py
          fi
  tests:
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select tested Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - run: sh scripts/test.sh
        env:
          CXX: clang++
  pi:
    needs: scope
    if: needs.scope.outputs.pi == 'true'
    name: Pi ARM64 controller
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build and test Pi controller
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 test --manifest-path pi/core/Cargo.toml --locked
          WAVEFORM_BUILD_ID="$GITHUB_SHA" cargo +1.98.1 build --manifest-path pi/core/Cargo.toml --release --locked
          WAVEFORM_TEST_BIN=pi/core/target/release/waveform-display python3 pi/recognition/transport_check.py
          mkdir -p dist
          tar -czf dist/waveform-control-linux-aarch64.tar.gz -C pi/core/target/release waveform-control waveform-display -C "$GITHUB_WORKSPACE" pi/recognition pi/scripts
          mkdir -p update-stage/wheels update-stage/bin
          cp pi/core/target/release/waveform-display update-stage/bin/
          mkdir -p update-stage/pi
          cp -R pi/recognition pi/scripts pi/updater update-stage/pi/
          python3 -m pip download --only-binary=:all: -r pi/recognition/requirements.lock -d update-stage/wheels
          tar --exclude='__pycache__' --exclude='tests' -czf dist/waveform-one-pi.tar.gz -C update-stage bin pi wheels
          python3 scripts/package-update.py --record-pi dist
          cd dist
          sha256sum waveform-control-linux-aarch64.tar.gz > waveform-control-linux-aarch64.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-controller
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  firmware:
    needs: scope
    if: needs.scope.outputs.firmware != '[]'
    name: ESP32 ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.scope.outputs.firmware) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build firmware
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          . "$IDF_PATH/export.sh"
          cd "firmware/esp32/$APP"
          idf.py build
      - name: Package production firmware
        if: matrix.app == 'visualizer'
        run: python3 scripts/package-firmware.py firmware/esp32/visualizer/build dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.app == 'visualizer'
        with:
          name: esp32-visualizer
          path: dist/*
          if-no-files-found: error
          retention-days: 14
