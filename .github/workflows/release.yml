name: CI and Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-release
  cancel-in-progress: false
jobs:
  plan:
    name: Allocate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          python3 scripts/release.py plan --output /tmp/release-plan.json
          echo "version=$(jq -r 'if . == null then "0.0.0" else .tag[1:] end' /tmp/release-plan.json)" >> "$GITHUB_OUTPUT"
  validate:
    needs: plan
    uses: ./.github/workflows/validate.yml
    with:
      release-version: ${{ needs.plan.outputs.version }}
  release:
    name: Publish validated release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ota
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare empty release staging directory
        id: staging
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/waveform-release.XXXXXX")
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      # Both artifacts come from this run's successful validate job, not another run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: esp32-visualizer
          path: ${{ steps.staging.outputs.directory }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pi-controller
          path: ${{ steps.staging.outputs.directory }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: esp32-p4-ota
          path: ${{ steps.staging.outputs.directory }}
      - name: Verify complete validated artifacts before signing
        env:
          RELEASE_DIST: ${{ steps.staging.outputs.directory }}
        run: python3 scripts/package-update.py --verify "$RELEASE_DIST"
      - name: Compute version and publish assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SEQUENCE_OFFSET: ${{ vars.UPDATE_SEQUENCE_OFFSET }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_DIST: ${{ steps.staging.outputs.directory }}
        run: |
          python3 scripts/release.py plan --output /tmp/release-plan.json
          if [ "$(cat /tmp/release-plan.json)" = null ]; then
            echo 'No pending changesets; no release needed.'
            exit 0
          fi
          # A newer main push may have overtaken this queued run.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'Superseded main commit; the latest run will release accumulated changesets.'
            exit 0
          fi
          python3 scripts/package-update.py "$RELEASE_DIST" /tmp/release-plan.json
          python3 scripts/package-p4-update.py package --dist "$RELEASE_DIST" --plan /tmp/release-plan.json
          tag=$(jq -r .tag /tmp/release-plan.json)
          jq -r .notes /tmp/release-plan.json > /tmp/release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Waveform One $tag" --notes-file /tmp/release-notes.md --draft
          fi
          # Only resume our draft for this commit; never overwrite published assets.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            # Tempo publication contract: replace drafts only, then download and verify every asset.
            verification=$(mktemp -d "$RUNNER_TEMP/waveform-verify.XXXXXX")
            gh release view "$tag" --json assets --jq '.assets[].name' > "$verification/existing"
            while IFS= read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done < "$verification/existing"
            gh release upload "$tag" "$RELEASE_DIST"/*
            mkdir "$verification/downloaded"
            gh release download "$tag" --pattern '*' --dir "$verification/downloaded"
            python3 scripts/package-p4-update.py verify-assets --dist "$RELEASE_DIST" --downloaded "$verification/downloaded"
            gh release edit "$tag" --draft=false --latest
          else
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          fi
