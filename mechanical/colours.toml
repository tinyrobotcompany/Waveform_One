# Colours of the printed case. Change a colour here, then rebuild:
#
#     cd mechanical/cad && uv run python -m waveform_one.build
#
# Every print job in exports/print_jobs/ then opens in ElegooSlicer with these
# colours already in its four filament slots, each part on its slot, and the
# purge volumes between the colours worked out the way ElegooSlicer does.
#
# Colours are "#RRGGBB", as in the slicer's colour picker. When printing, load
# the CANVAS with filaments of these colours.

body = "#000000"      # slot 1: the cabinet, the record holders and all small parts
stripe_1 = "#FFFFFF"  # slot 2: the first band, 10 mm behind the front
stripe_2 = "#FFFFFF"  # slot 3: the second band, 40 mm behind the front
name = "#FFFFFF"      # slot 4: WAVEFORM ONE on the front
